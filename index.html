<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>請求書PWA（完全同一レイアウト版）</title>
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />

  <!-- 画面表示フォント（PDFはキャンバス化するので日本語OK） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{ --bg:#1a1a1a; --text:#f2f5fb; --muted:#666; --border:#111; --card:#f6f6f6; }
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP", system-ui, -apple-system, sans-serif;overflow-x:hidden;}
    .hero{width:100%;background:#1a1a1a;}
    .heroInner{max-width:100%;margin:0 auto;padding:0;}
    .hero img{display:block;width:100%;height:auto;}
    .wrap{max-width:980px;margin:0 auto;padding:14px;}
    h1{font-size:18px;margin:0 0 10px;}
    .small{font-size:12px;color:var(--muted);line-height:1.55;}
    .appVersion{
      margin:6px 0 8px;
      color:#fff;
      font-size:11px;
      font-weight:700;
      line-height:1.2;
      text-align:center;
      opacity:.9;
    }
    .bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
    button{border:2px solid var(--border);background:#fff;padding:10px 12px;font-weight:900;border-radius:12px;cursor:pointer}
    button.primary{background:#111;color:#fff;}
    button.saveBtn{border-color:#2f9e44;color:#2f9e44;background:#fff;}
    button.danger{border-color:#c00;color:#c00}
    .card{border:2px solid var(--border);border-radius:16px;padding:12px;background:#fff;margin:10px 0;color:#111;}
    .sectionTitle{font-weight:900;margin:4px 0 10px;}
    .commonHeader{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;}
    .commonCollapsedTitle{
      display:none;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
      max-width:540px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .commonBody{margin-top:10px;}
    .commonCard.isCollapsed .commonBody{display:none;}
    .commonCard.isCollapsed .commonCollapsedTitle{display:block;}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;}
    .row{display:grid;grid-template-columns: 130px 1fr; gap:10px; align-items:center;}
    .label{font-size:12px;color:var(--muted);font-weight:900;}
    input,textarea{
      width:100%; box-sizing:border-box;
      border:2px solid var(--border);
      border-radius:12px;
      padding:10px 10px;
      font-size:16px;
      background:#fff;
    }
    input[readonly]{background:#f8f8f8}
    textarea{min-height:70px;resize:vertical;}
    .pill{display:inline-block;border:2px solid var(--border);border-radius:999px;padding:4px 10px;font-weight:900;font-size:12px;background:var(--card)}
    .invoiceHeader{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
    .invoiceTitleWrap{min-width:0;flex:1 1 auto;}
    .invoiceMeta{display:block;}
    .invoiceCollapsedTitle{
      display:none;
      font-size:15px;
      font-weight:900;
      line-height:1.3;
      width:100%;
      max-width:none;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .invoiceBody{margin-top:10px;}
    .card.isCollapsed{padding:10px 12px;}
    .card.isCollapsed .invoiceHeader{align-items:center;flex-wrap:nowrap;}
    .card.isCollapsed .invoiceMeta{display:none;}
    .card.isCollapsed .invoiceCollapsedTitle{display:block;}
    .card.isCollapsed .invoiceBody{display:none;}
    .card.isCollapsed .invoiceHeader .bar{flex-wrap:nowrap;flex:0 0 auto;}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media (max-width:720px){
      .row{grid-template-columns:1fr;}
      .two{grid-template-columns:1fr;}
      .commonCollapsedTitle{max-width:100%;}
    }
    .hr{height:1px;background:#ddd;margin:10px 0;}
    .moneyBox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .moneyBox .m{border:2px solid #ddd;border-radius:12px;padding:8px;background:#fafafa}
    .moneyBox .t{font-size:11px;color:var(--muted);font-weight:900}
    .moneyBox .v{font-size:16px;font-weight:900;margin-top:3px}
    .toast{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:18px; background:#111; color:#fff;
      padding:10px 12px; border-radius:999px;
      font-size:12px; font-weight:900;
      opacity:0; pointer-events:none; transition:opacity .2s;
      max-width:90vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      z-index:9999;
    }
    .toast.show{opacity:1;}
    .hint{font-size:12px;color:var(--muted);margin-top:8px}

    /* ===== A4請求書（PDF化対象） ===== */
    .a4stage{position:fixed; left:0; top:0; width:210mm; height:297mm; background:#fff; opacity:0; pointer-events:none; transform:translateX(-200vw); }
    .a4{isolation:isolate; contain:layout paint;
      width:210mm; height:297mm; background:#fff;
      box-sizing:border-box;
      padding:12mm;
      color:#000;
      font-family:"Noto Sans JP", sans-serif;
    }
    .a4 .invTitle{
      position:absolute;
      top:12mm;
      right:12mm;
      font-size:18pt;
      font-weight:900;
      letter-spacing:2px;
    }
    .a4 .customer{
      position:absolute;
      top:24mm;
      left:12mm;
      font-size:14pt;
      font-weight:700;
      padding-bottom:2mm;
      width:120mm;
      border-bottom:1px solid #000;
    }
    .a4 .issuer{
      position:absolute;
      top:29mm;
      right:12mm;
      width:80mm;
      text-align:right;
      font-size:9pt;
      line-height:1.35;
      white-space:pre-wrap;
    }
    .a4 .dates{
      position:absolute;
      top:40mm;
      left:12mm;
      font-size:10pt;
      line-height:1.4;
      white-space:pre-wrap;
    }
    .a4 .table{
      position:absolute;
      top:57mm;
      left:12mm;
      right:12mm;
      border:1px solid #000;
      border-collapse:collapse;
      font-size:10pt;
      width:calc(210mm - 24mm);
      table-layout:fixed;
    }
    .a4 .table th,.a4 .table td{
      border:1px solid #000;
      padding:2.2mm 2mm;
      vertical-align:middle;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .a4 .table th{font-weight:900; background:#fff;}
    .a4 .alignR{text-align:right}
    .a4 .alignC{text-align:center}

    .a4 .summary{
      position:absolute;
      top:80mm;
      right:12mm;
      width:70mm;
      font-size:10pt;
      line-height:1.6;
    }
    .a4 .summaryRow{
      display:flex;
      justify-content:space-between;
      gap:6mm;
    }
    .a4 .summaryRow .k{font-weight:700}
    .a4 .summaryRow .v{font-weight:900}
    .a4 .summaryLine{
      height:0;
      border-top:1px solid #000;
      margin:1mm 0 1mm 0;
    }

    .a4 .bankTitle{
      position:absolute;
      top:99mm;
      left:12mm;
      font-size:10pt;
      font-weight:900;
    }
    .a4 .bankText{
      position:absolute;
      top:104mm;
      left:12mm;
      right:12mm;
      font-size:9pt;
      line-height:1.45;
      white-space:pre-wrap;
    }
    .a4 .remarkTitle{
      position:absolute;
      bottom:16mm;
      left:12mm;
      font-size:10pt;
      font-weight:900;
    }
    .a4 .remarkText{
      position:absolute;
      bottom:6mm;
      left:12mm;
      right:12mm;
      font-size:9pt;
      line-height:1.45;
      white-space:pre-wrap;
    }
  </style>

  <!-- PDF生成：HTMLをキャンバス化 → PDFへ貼り付け（日本語フォント問題ゼロ） -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>
  <div class="hero">
    <div class="heroInner">
      <img src="VOUG-IV-SS.png" alt="F.D.L VOUG Invoice Builder" />
    </div>
  </div>

  <div class="wrap">
    <div class="appVersion">VOUG I.B. ver-7</div>

    <div class="bar">
      <button id="addBtn">＋ 請求先カードを追加</button>
      <button id="saveBtn" class="saveBtn">入力を保存</button>
      <button id="loadBtn">保存を読込</button>
    </div>
    <input id="backupFileInput" type="file" accept="application/json,.json" hidden />

    <div id="commonCard" class="card commonCard">
      <div class="commonHeader">
        <div class="invoiceTitleWrap">
          <div class="sectionTitle" style="margin:0;">共通：自社情報</div>
          <div id="commonCollapsedTitle" class="commonCollapsedTitle"></div>
        </div>
        <button id="toggleCommonBtn" type="button">折りたたむ</button>
      </div>
      <div class="grid commonBody">
        <div class="row"><div class="label">発行元名</div><input id="issuer_name" /></div>
        <div class="row"><div class="label">住所</div><input id="issuer_addr" /></div>
        <div class="two">
          <div class="row"><div class="label">TEL</div><input id="issuer_tel" /></div>
          <div class="row"><div class="label">担当/連絡先</div><input id="issuer_person" /></div>
        </div>
        <div class="row"><div class="label">メール</div><input id="issuer_email" /></div>

        <div class="hr"></div>

        <div class="sectionTitle">共通：振込先</div>
        <div class="row"><div class="label">振込先（メイン）</div><input id="bank_main" /></div>
        <div class="row"><div class="label">予備口座</div><input id="bank_sub" /></div>
      </div>
    </div>

    <div class="card">
      <div class="sectionTitle">共通：請求日 / 振込期限</div>
      <div class="grid">
        <div class="two">
          <div class="row"><div class="label">請求日</div><input id="common_issue_date" type="date" /></div>
          <div class="row"><div class="label">振込期限</div><input id="common_due_date" type="date" /></div>
        </div>
        <div class="hint">※ 形式は請求日の月から自動で「○月分」になります。</div>
      </div>
    </div>

    <div id="invoices"></div>

  </div>

  <div id="toast" class="toast"></div>

  <!-- PDF化用のA4ステージ（画面外） -->
  <div class="a4stage" aria-hidden="true">
    <div id="a4" class="a4">
      <div class="invTitle">請 求 書</div>
      <div id="p_customer" class="customer"></div>
      <div id="p_issuer" class="issuer"></div>
      <div id="p_dates" class="dates"></div>

      <table class="table">
        <colgroup>
          <col style="width:42%">
          <col style="width:20%">
          <col style="width:13%">
          <col style="width:25%">
        </colgroup>
        <thead>
          <tr>
            <th>品名</th>
            <th>形式</th>
            <th class="alignC">数量</th>
            <th class="alignR">単価</th>
          </tr>
        </thead>
        <tbody id="p_items_body"></tbody>
      </table>

      <div id="p_summary" class="summary">
        <div class="summaryRow"><span class="k">小計</span><span id="p_sub" class="v"></span></div>
        <div class="summaryRow"><span class="k">消費税</span><span id="p_tax" class="v"></span></div>
        <div class="summaryLine"></div>
        <div class="summaryRow"><span class="k">合計</span><span id="p_total" class="v"></span></div>
      </div>

      <div id="p_bank_title" class="bankTitle">振込先</div>
      <div id="p_bank" class="bankText"></div>

      <div id="p_remark_title" class="remarkTitle">備考</div>
      <div id="p_remark" class="remarkText"></div>
    </div>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }

  const $ = (s)=>document.querySelector(s);
  const invoicesEl = $('#invoices');
  const BACKUP_BASENAME = 'VOUG請求情報.json';

  function backupFilename(date = new Date()){
    return `${date.getMonth()+1}月分_${BACKUP_BASENAME}`;
  }
  function isAndroidDevice(){
    return /Android/i.test(navigator.userAgent || '');
  }

  const DEFAULT_COMMON = {
    issuer_name: 'VOUG',
    issuer_addr: '札幌市西区二十四軒2条2丁目4-21 マンションニュー琴似1F-B号',
    issuer_tel: '011-614-5286',
    issuer_person: '担当 畑野千春 090-7842-8798',
    issuer_email: 'voug286@gmeil.com',
    common_issue_date: '',
    common_due_date: '',
    bank_main: '旭川信用金庫 本店 普通口座 1472165 口座名 有限会社ニューアロー',
    bank_sub: '(予備銀行) 楽天銀行 チェロ支店（214） 普通口座 1310243 口座名 ハタノチハル'
  };

  function todayISO(){
    const d=new Date();
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function jpDate(iso){ return (iso && /^\d{4}-\d{2}-\d{2}$/.test(iso)) ? iso.replaceAll('-','.') : ''; }
  function monthLabel(iso){
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
    const m = Number(iso.slice(5,7)); return m ? `${m}月分` : '';
  }
  function customerWithHonorific(name){
    const base = String(name || '').trim().replace(/\s*様$/,'').trim();
    return base ? `${base} 様` : '';
  }
  function fmtYen(n){ return Number(n||0).toLocaleString('ja-JP'); }
  function calc(inv){
    const rate=Number(inv.tax_rate??0.10);
    const items = Array.isArray(inv.items) ? inv.items : [];
    const sub=items.reduce((sum,item)=>sum + (Number(item.qty||0) * Number(item.unit_price||0)),0);
    const tax=Math.round(sub*rate); const total=sub+tax;
    return {sub,tax,total};
  }
  function toast(msg){
    const el=$('#toast'); el.textContent=msg; el.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
  }

  function defaultItem(){
    return { item_name:'', qty:'', unit_price:'' };
  }
  function defaultInvoice(){
    return { customer:'', items:[defaultItem()], tax_rate:0.10, remarks:'', collapsed:true };
  }
  function createDefaultInvoices(count=12){
    return Array.from({length:count}, ()=>defaultInvoice());
  }
  function normalizeInvoice(inv){
    const normalized = {
      customer: inv?.customer || '',
      tax_rate: Number(inv?.tax_rate ?? 0.10),
      remarks: inv?.remarks || '',
      collapsed: typeof inv?.collapsed === 'boolean' ? inv.collapsed : true,
      items: []
    };
    if (Array.isArray(inv?.items) && inv.items.length){
      normalized.items = inv.items.map((item)=>({
        item_name: item?.item_name || '',
        qty: Number(item?.qty || 0),
        unit_price: Number(item?.unit_price || 0)
      }));
    } else {
      normalized.items = [{
        item_name: inv?.item_name || '',
        qty: Number(inv?.qty || 0),
        unit_price: Number(inv?.unit_price || 0)
      }];
    }
    if (!normalized.items.length) normalized.items=[defaultItem()];
    return normalized;
  }

  let state = {
    common:{...DEFAULT_COMMON},
    invoices:createDefaultInvoices(12),
    ui:{ commonCollapsed:true }
  };
  state.common.common_issue_date = todayISO();
  function commonSummary(){
    const name = state.common.issuer_name || '未設定';
    const tel = state.common.issuer_tel || 'TEL未設定';
    const email = state.common.issuer_email || 'メール未設定';
    return `${name} / ${tel} / ${email}`;
  }
  function syncCommonCollapsedUI(){
    const commonCard = $('#commonCard');
    const toggleBtn = $('#toggleCommonBtn');
    const title = $('#commonCollapsedTitle');
    if(!commonCard || !toggleBtn || !title) return;
    title.textContent = commonSummary();
    commonCard.classList.toggle('isCollapsed', Boolean(state.ui?.commonCollapsed));
    toggleBtn.textContent = state.ui?.commonCollapsed ? '展開' : '折りたたむ';
  }

  function readCommonFromUI(){
    state.common.issuer_name=$('#issuer_name').value.trim();
    state.common.issuer_addr=$('#issuer_addr').value.trim();
    state.common.issuer_tel=$('#issuer_tel').value.trim();
    state.common.issuer_person=$('#issuer_person').value.trim();
    state.common.issuer_email=$('#issuer_email').value.trim();
    state.common.common_issue_date=$('#common_issue_date').value.trim();
    state.common.common_due_date=$('#common_due_date').value.trim();
    state.common.bank_main=$('#bank_main').value.trim();
    state.common.bank_sub=$('#bank_sub').value.trim();
    syncCommonCollapsedUI();
  }
  function writeCommonToUI(){
    $('#issuer_name').value=state.common.issuer_name||'';
    $('#issuer_addr').value=state.common.issuer_addr||'';
    $('#issuer_tel').value=state.common.issuer_tel||'';
    $('#issuer_person').value=state.common.issuer_person||'';
    $('#issuer_email').value=state.common.issuer_email||'';
    $('#common_issue_date').value=state.common.common_issue_date||'';
    $('#common_due_date').value=state.common.common_due_date||'';
    $('#bank_main').value=state.common.bank_main||'';
    $('#bank_sub').value=state.common.bank_sub||'';
    syncCommonCollapsedUI();
  }

  function createCard(inv, idx){
    const c=document.createElement('div');
    c.className='card'; c.dataset.idx=String(idx);
    if(inv.collapsed) c.classList.add('isCollapsed');
    const {sub,tax,total}=calc(inv);
    const form=monthLabel(state.common.common_issue_date);
    const customerLabel = customerWithHonorific(inv.customer).trim() || `請求先 #${idx+1}`;
    const itemRows = (inv.items || []).map((item,itemIdx)=>`
      <div class="row itemRow" data-item-idx="${itemIdx}">
        <div class="label">商品 #${itemIdx+1}</div>
        <div style="display:grid;gap:8px;">
          <input class="item_name" value="${escapeHtml(item.item_name)}" placeholder="例）D-1X" />
          <input class="item_form" value="${escapeHtml(form)}" readonly />
          <div class="two">
            <input class="qty" inputmode="numeric" value="${escapeHtml(item.qty)}" placeholder="数量" />
            <input class="unit_price" inputmode="numeric" value="${escapeHtml(item.unit_price)}" placeholder="単価" />
          </div>
          <button class="delItemBtn danger" type="button">この商品を削除</button>
        </div>
      </div>
    `).join('');

    c.innerHTML = `
      <div class="invoiceHeader">
        <div class="invoiceTitleWrap">
          <div class="invoiceMeta">
            <div class="pill">請求先 #${idx+1}</div>
            <div class="small" style="margin-top:6px;">このカード = PDF 1ページ</div>
          </div>
          <div class="invoiceCollapsedTitle">${escapeHtml(customerLabel)}</div>
        </div>
        <div class="bar" style="margin:0;">
          <button class="pdfBtn primary">${inv.collapsed ? 'PDF出力' : 'この請求先のPDF'}</button>
          <button class="toggleBtn">${inv.collapsed ? '展開' : '折りたたむ'}</button>
          ${inv.collapsed ? '' : '<button class="delBtn danger">削除</button>'}
        </div>
      </div>

      <div class="grid invoiceBody">
        <div class="row"><div class="label">宛名（請求先）</div><input class="customer" value="${escapeHtml(inv.customer)}" placeholder="例）のみくい処 旨や 様" /></div>

        <div class="hr"></div>
        <div class="sectionTitle">明細（複数行）</div>
        ${itemRows}
        <button class="addItemBtn primary" type="button">＋ 商品を追加</button>

        <div class="row"><div class="label">税率</div><input class="tax_rate" inputmode="decimal" value="${escapeHtml(inv.tax_rate)}" placeholder="0.10" /></div>

        <div class="moneyBox">
          <div class="m"><div class="t">小計</div><div class="v">¥${fmtYen(sub)}</div></div>
          <div class="m"><div class="t">消費税</div><div class="v">¥${fmtYen(tax)}</div></div>
          <div class="m"><div class="t">合計</div><div class="v">¥${fmtYen(total)}</div></div>
        </div>

        <div class="row"><div class="label">備考</div><textarea class="remarks" placeholder="自由記載">${escapeHtml(inv.remarks)}</textarea></div>
      </div>
    `;

    const bind = (sel,key,parser=(v)=>v)=>{
      const el=c.querySelector(sel);
      el.addEventListener('input',()=>{
        const i=Number(c.dataset.idx);
        state.invoices[i][key]=parser(el.value);
        if(key==='customer'){
          const label = c.querySelector('.invoiceCollapsedTitle');
          if(label){
            const text = customerWithHonorific(state.invoices[i].customer).trim() || `請求先 #${i+1}`;
            label.textContent = text;
          }
        }
        refreshMoney(c,state.invoices[i]);
      });
    };
    bind('.customer','customer',(v)=>customerWithHonorific(v));
    bind('.tax_rate','tax_rate',(v)=>Number(v||0));
    bind('.remarks','remarks',(v)=>v);

    c.querySelector('.addItemBtn').addEventListener('click',()=>{
      const i=Number(c.dataset.idx);
      state.invoices[i].items.push(defaultItem());
      render();
    });

    c.addEventListener('input',(e)=>{
      const target=e.target;
      if(!(target instanceof HTMLElement)) return;
      const row=target.closest('.itemRow');
      if(!row) return;
      const i=Number(c.dataset.idx);
      const itemIdx=Number(row.dataset.itemIdx);
      const item=state.invoices[i].items[itemIdx];
      if(!item) return;
      if(target.classList.contains('item_name')) item.item_name=target.value;
      if(target.classList.contains('qty')) item.qty=Number(target.value||0);
      if(target.classList.contains('unit_price')) item.unit_price=Number(target.value||0);
      refreshMoney(c,state.invoices[i]);
    });

    c.addEventListener('click',(e)=>{
      const target=e.target;
      if(!(target instanceof HTMLElement)) return;
      if(!target.classList.contains('delItemBtn')) return;
      const row=target.closest('.itemRow');
      if(!row) return;
      const i=Number(c.dataset.idx);
      const itemIdx=Number(row.dataset.itemIdx);
      state.invoices[i].items.splice(itemIdx,1);
      if(state.invoices[i].items.length===0) state.invoices[i].items.push(defaultItem());
      render();
    });

    const delBtn = c.querySelector('.delBtn');
    if(delBtn){
      delBtn.addEventListener('click',()=>{
        const i=Number(c.dataset.idx);
        state.invoices.splice(i,1);
        if(state.invoices.length===0) state.invoices.push(defaultInvoice());
        render(); toast('削除しました');
      });
    }

    c.querySelector('.pdfBtn').addEventListener('click',async()=>{
      readCommonFromUI();
      const i=Number(c.dataset.idx);
      await generatePdf([state.invoices[i]]);
    });
    c.querySelector('.toggleBtn').addEventListener('click',()=>{
      const i=Number(c.dataset.idx);
      state.invoices[i].collapsed = !state.invoices[i].collapsed;
      render();
    });

    return c;
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }
  function refreshMoney(card,inv){
    const {sub,tax,total}=calc(inv);
    const v=card.querySelectorAll('.moneyBox .v');
    if(v.length===3){ v[0].textContent=`¥${fmtYen(sub)}`; v[1].textContent=`¥${fmtYen(tax)}`; v[2].textContent=`¥${fmtYen(total)}`; }
  }
  function render(){
    invoicesEl.innerHTML='';
    state.invoices.forEach((inv,idx)=>invoicesEl.appendChild(createCard(inv,idx)));
  }
  function updateAllFormLabels(){
    document.querySelectorAll('.item_form').forEach(el=>el.value=monthLabel(state.common.common_issue_date));
  }

  function exportStateAsBackupObject(){
    readCommonFromUI();
    return {
      format: 'VOUG請求情報',
      version: 1,
      saved_at: new Date().toISOString(),
      state
    };
  }
  function applyLoadedState(payload){
    if(!(payload && payload.common && Array.isArray(payload.invoices))){
      throw new Error('invalid_payload');
    }
    state.common = {...DEFAULT_COMMON, ...(payload.common || {})};
    state.invoices = (payload.invoices || []).map(normalizeInvoice);
    state.ui = {
      commonCollapsed: typeof payload?.ui?.commonCollapsed === 'boolean'
        ? payload.ui.commonCollapsed
        : true
    };
    if(state.invoices.length===0) state.invoices=createDefaultInvoices(12);
    if(!state.common.common_issue_date) state.common.common_issue_date=todayISO();
    writeCommonToUI();
    render();
  }
  function extractBackupPayload(obj){
    if(!obj || typeof obj !== 'object') return null;
    if(obj.common && Array.isArray(obj.invoices)) return obj;
    if(obj.state && typeof obj.state === 'object' && obj.state.common && Array.isArray(obj.state.invoices)){
      return obj.state;
    }
    return null;
  }
  function parseBackupState(raw){
    try{
      const obj=JSON.parse(String(raw || '').replace(/^\uFEFF/, '').trim());
      const payload = extractBackupPayload(obj);
      applyLoadedState(payload);
      return true;
    }catch(err){
      console.warn('Failed to load VOUG invoice backup JSON:', err);
      return false;
    }
  }
  function readTextFile(file){
    if(file && typeof file.text === 'function') return file.text();
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error || new Error('file_read_failed'));
      reader.readAsText(file, 'utf-8');
    });
  }
  function downloadBackup(text, filename){
    const blob = new Blob([text], {type:'application/json;charset=utf-8'});
    if(blob.size === 0) throw new Error('empty_backup_blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Androidではダウンロード開始が遅れる場合があるため、URLをすぐ破棄しない。
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }
  async function saveWithFilePicker(text, filename){
    const handle = await window.showSaveFilePicker({
      suggestedName: filename,
      types: [{
        description: 'JSON',
        accept: { 'application/json': ['.json'] }
      }]
    });
    const writable = await handle.createWritable();
    await writable.write(new Blob([text], {type:'application/json;charset=utf-8'}));
    await writable.close();

    // 「空ファイルを作っただけ」を成功扱いしないよう、保存後に読み戻して確認する。
    const savedFile = await handle.getFile();
    const savedText = await readTextFile(savedFile);
    if(savedFile.size === 0 || savedText !== text){
      throw new Error('backup_verification_failed');
    }
  }
  async function save(){
    const backup = exportStateAsBackupObject();
    const text = JSON.stringify(backup, null, 2);
    const filename = backupFilename();

    // Android版のFile System Access APIでは0バイトファイルが残る場合があるため使わない。
    if(!isAndroidDevice() && typeof window.showSaveFilePicker === 'function'){
      try{
        await saveWithFilePicker(text, filename);
        toast('JSONバックアップを保存しました');
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return;
        console.error('Failed to save VOUG invoice backup:', err);
        toast('保存に失敗しました');
        return;
      }
    }

    try{
      downloadBackup(text, filename);
      toast('JSONバックアップの保存を開始しました');
    }catch(err){
      console.error('Failed to download VOUG invoice backup:', err);
      toast('保存に失敗しました');
    }
  }
  async function load(){
    try{
      if(window.showOpenFilePicker){
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: 'JSON',
            accept: { 'application/json': ['.json'] }
          }]
        });
        const file = await handle.getFile();
        const raw = await readTextFile(file);
        if(parseBackupState(raw)){
          toast('JSONバックアップを読み込みました');
        }else{
          toast('JSON形式が不正です');
        }
        return;
      }
    }catch(err){
      if(err && err.name === 'AbortError') return;
    }
    const input = $('#backupFileInput');
    if(!input){
      toast('読込入力が見つかりません');
      return;
    }
    input.value = '';
    input.click();
  }
  // ===== PDF生成（A4 / 完全同一レイアウト）=====
  async function renderA4(inv){
    const common=state.common;
    const form=monthLabel(common.common_issue_date);
    const issue=jpDate(common.common_issue_date);
    const due=jpDate(common.common_due_date);

    // 文字（最初のPDFの見え方に合わせて整形）
    $('#p_customer').textContent = customerWithHonorific(inv.customer) || '（宛名未設定）';
    $('#p_issuer').textContent =
      `${common.issuer_name || ''}\n${common.issuer_addr || ''}\n` +
      `${common.issuer_tel ? 'TEL ' + common.issuer_tel : ''}\n` +
      `${common.issuer_person || ''}\n${common.issuer_email || ''}`.trim();

    let dateLines = '';
    if (issue) dateLines += `請求日：${issue}\n`;
    if (due) dateLines += `振込期限：${due}`;
    $('#p_dates').textContent = dateLines.trim();

    const body = $('#p_items_body');
    const rows = (inv.items || []).map((item)=>`
      <tr>
        <td>${escapeHtml(item.item_name || '')}</td>
        <td>${escapeHtml(form || '')}</td>
        <td class="alignC">${escapeHtml(String(item.qty ?? ''))}</td>
        <td class="alignR">${escapeHtml(`${fmtYen(item.unit_price || 0)}円`)}</td>
      </tr>
    `).join('');
    body.innerHTML = rows || '<tr><td></td><td></td><td class="alignC"></td><td class="alignR"></td></tr>';

    const {sub,tax,total}=calc(inv);
    $('#p_sub').textContent = `¥${fmtYen(sub)}`;
    $('#p_tax').textContent = `¥${fmtYen(tax)}`;
    $('#p_total').textContent = `¥${fmtYen(total)}`;

    const bank = [common.bank_main, common.bank_sub].filter(Boolean).join('\n');
    $('#p_bank').textContent = bank;

    $('#p_remark').textContent = (inv.remarks || '').trim();

    // 明細行数と各テキスト量に応じて下部ブロックを自動配置（重なり防止）
    const table = document.querySelector('#a4 .table');
    const summary = $('#p_summary');
    const bankTitle = $('#p_bank_title');
    const bankText = $('#p_bank');
    const remarkTitle = $('#p_remark_title');
    const remarkText = $('#p_remark');
    if (table && summary && bankTitle && bankText && remarkTitle && remarkText){
      const px = (mm)=>Math.round(mm * 3.7795);
      const pageHeight = px(297);
      const bottomPadding = px(8);
      const gapS = px(3);
      const gapL = px(5);
      const baseSummaryTop = table.offsetTop + table.offsetHeight + gapS;

      summary.style.top = `${baseSummaryTop}px`;
      summary.style.bottom = 'auto';

      bankTitle.style.top = `${summary.offsetTop + summary.offsetHeight + gapS}px`;
      bankTitle.style.bottom = 'auto';

      bankText.style.top = `${bankTitle.offsetTop + gapL}px`;
      bankText.style.bottom = 'auto';

      remarkTitle.style.top = `${bankText.offsetTop + bankText.offsetHeight + gapS}px`;
      remarkTitle.style.bottom = 'auto';

      remarkText.style.top = `${remarkTitle.offsetTop + gapL}px`;
      remarkText.style.bottom = 'auto';

      const overflow = (remarkText.offsetTop + remarkText.offsetHeight + bottomPadding) - pageHeight;
      if (overflow > 0){
        const minSummaryTop = baseSummaryTop;
        const nextSummaryTop = Math.max(minSummaryTop, summary.offsetTop - overflow);
        const shift = summary.offsetTop - nextSummaryTop;
        summary.style.top = `${summary.offsetTop - shift}px`;
        bankTitle.style.top = `${bankTitle.offsetTop - shift}px`;
        bankText.style.top = `${bankText.offsetTop - shift}px`;
        remarkTitle.style.top = `${remarkTitle.offsetTop - shift}px`;
        remarkText.style.top = `${remarkText.offsetTop - shift}px`;
      }
    }

    // フォント読み込み待ち（Google Fonts）
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch(_){}
    }
  }

  async function a4ToCanvas(){
    const a4 = document.getElementById('a4');
    // scale を上げると印刷が綺麗（重くなるので2で妥協）
    return await html2canvas(a4, {
      backgroundColor:'#ffffff',
      scale: 2,
      useCORS: true
    });
  }

  async function generatePdf(invoices){
    const { jsPDF } = window.jspdf || {};
    if(!jsPDF || !window.html2canvas){
      alert('PDFライブラリが読み込めていません。最初はオンラインで開いてください。');
      return;
    }
    const doc = new jsPDF({unit:'mm', format:'a4'});

    for(let i=0;i<invoices.length;i++){
      if(i>0) doc.addPage();

      toast(`PDF生成中… ${i+1}/${invoices.length}`);
      await renderA4(invoices[i]);

      const canvas = await a4ToCanvas();
      const imgData = canvas.toDataURL('image/jpeg', 0.92);

      // A4にぴったり貼る
      doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    }

    const issueLabel = jpDate(state.common.common_issue_date) || todayISO().replaceAll('-', '.');
    const baseCustomer = customerWithHonorific(invoices[0]?.customer || '').trim() || '請求先未設定';
    const customerLabel = invoices.length === 1
      ? baseCustomer
      : `${baseCustomer}ほか${invoices.length-1}件`;
    const safeName = `${issueLabel} - ${customerLabel}`.replace(/[\\/:*?"<>|]/g, '_');
    const filename = `${safeName}.pdf`;
    doc.save(filename);
    toast('PDFを作成しました');
  }

  // ===== イベント =====
  $('#addBtn').addEventListener('click',()=>{ state.invoices.push(defaultInvoice()); render(); toast('請求先カードを追加しました'); });
  $('#saveBtn').addEventListener('click',save);
  $('#loadBtn').addEventListener('click',load);
  $('#backupFileInput').addEventListener('change', async(e)=>{
    const input = e.target;
    if(!(input instanceof HTMLInputElement)) return;
    const file = input.files && input.files[0];
    if(!file) return;
    try{
      const raw = await readTextFile(file);
      if(parseBackupState(raw)){
        toast('JSONバックアップを読み込みました');
      }else{
        toast('JSON形式が不正です');
      }
    }catch(_){
      toast('読み込みに失敗しました');
    }finally{
      input.value = '';
    }
  });
  $('#toggleCommonBtn').addEventListener('click',()=>{
    state.ui.commonCollapsed = !state.ui.commonCollapsed;
    syncCommonCollapsedUI();
  });

  ['issuer_name','issuer_addr','issuer_tel','issuer_person','issuer_email','bank_main','bank_sub']
    .forEach(id => $('#'+id).addEventListener('input',()=>readCommonFromUI()));
  $('#common_issue_date').addEventListener('change',()=>{ readCommonFromUI(); updateAllFormLabels(); });
  $('#common_due_date').addEventListener('change',()=>readCommonFromUI());

  // 初期表示
  writeCommonToUI();
  render();
  syncCommonCollapsedUI();
</script>
</body>
</html>
